<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI提醒管家支持与帮助</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;max-width:760px;margin:48px auto;padding:0 24px;line-height:1.75;color:#17233b}h1{line-height:1.25}h2{margin-top:32px}a{color:#079c91}</style><h1>AI提醒管家支持与帮助</h1><p>遇到问题时，请先检查系统设置中的通知权限和麦克风/语音识别权限。</p><h2>提醒没有送达</h2><ol><li>打开“设置 → 通知 → AI提醒管家”，允许通知。</li><li>确认提醒时间、时区和重复规则正确。</li><li>检查设备是否开启了专注模式或系统限制。</li></ol><h2>语音输入不可用</h2><p>请在“设置 → 隐私与安全性”中允许麦克风和语音识别。你也可以直接使用文字输入。</p><h2>提交问题</h2><p>请在项目支持页提交问题，并附上 iOS 版本、设备型号和可复现步骤。</p><p><a href="https://github.com/leowayxw-blip/ai-reminder-assistant-privacy/issues">打开支持入口</a></p></html>
